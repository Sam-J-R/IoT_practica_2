; Esta configuración ejecuta pruebas Unity en la PC, no programa una placa.
[platformio]
test_dir = pruebas/unity

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -I pruebas/dobles
    -I sensor/include
    -I actuador/include
