; Un proyecto PlatformIO, dos firmwares independientes y pruebas nativas.
[platformio]
src_dir = firmware/src
test_dir = pruebas/unity
default_envs = esp32_sensor, esp32_actuador

[env:esp32_sensor]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<sensor/> -<actuador/>
build_flags =
    -Wall
    -Wextra
    -I firmware/include/sensor
    -I comun

[env:esp32_actuador]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<actuador/> -<sensor/>
build_flags =
    -Wall
    -Wextra
    -I firmware/include/actuador
    -I comun

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -I pruebas/dobles
    -I firmware/include/sensor
    -I firmware/include/actuador
    -I comun
