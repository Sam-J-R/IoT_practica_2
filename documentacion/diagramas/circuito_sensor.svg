<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="590" viewBox="0 0 1140 590"><rect width="1140" height="590" fill="#ffffff"/><text x="45" y="46" font-family="Arial" font-weight="bold" font-size="27" fill="#16253b">Circuito 1 — ESP32 sensor con divisor resistivo</text><text x="45" y="74" font-family="Arial" font-size="16" fill="#59677c">Esquema eléctrico de conexiones previstas · DOIT ESP32 DevKit v1 + HC-SR04</text><rect x="45" y="105" width="215" height="390" rx="10" fill="#eef4ff" stroke="#5575aa" stroke-width="2"/><rect x="885" y="105" width="210" height="390" rx="10" fill="#eef4ff" stroke="#5575aa" stroke-width="2"/><text x="152" y="142" font-family="Arial" font-size="25" fill="#1b314c" font-weight="bold" text-anchor="middle">HC-SR04</text><text x="990" y="142" font-family="Arial" font-size="24" fill="#1b314c" font-weight="bold" text-anchor="middle">ESP32 sensor</text><text x="245" y="165" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="end">VCC 5 V</text><text x="899" y="165" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="start">VIN / 5 V</text><text x="245" y="235" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="end">TRIG</text><text x="899" y="235" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="start">GPIO 14</text><text x="245" y="305" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="end">ECHO 5 V</text><text x="899" y="305" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="start">GPIO 27</text><text x="245" y="455" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="end">GND</text><text x="899" y="455" font-family="Arial" font-size="16" fill="#1b314c" font-weight="normal" text-anchor="start">GND</text><path d="M 260 175 L 885 175" fill="none" stroke="#b32337" stroke-width="3" stroke-linejoin="round"/><path d="M 260 245 L 885 245" fill="none" stroke="#1f759e" stroke-width="3" stroke-linejoin="round"/><path d="M 260 315 L 395 315" fill="none" stroke="#cb7f26" stroke-width="3" stroke-linejoin="round"/><path d="M 395 315 L 405 315 L 416.6666666666667 306 L 428.3333333333333 324 L 440.0 306 L 451.6666666666667 324 L 463.3333333333333 306 L 475.0 324 L 486.6666666666667 306 L 498.3333333333333 324 L 510 315 L 520 315" fill="none" stroke="#cc7a21" stroke-width="3"/><text x="457.5" y="292" font-family="Arial" font-size="17" fill="#a65c0c" font-weight="bold" text-anchor="middle">R1 = 1 kΩ</text><path d="M 520 315 L 720 315" fill="none" stroke="#cb7f26" stroke-width="3" stroke-linejoin="round"/><path d="M 720 315 L 885 315" fill="none" stroke="#cb7f26" stroke-width="3" stroke-linejoin="round"/><circle cx="720" cy="315" r="6" fill="#cb7f26"/><path d="M 720 315 L 720 353" fill="none" stroke="#34577e" stroke-width="3" stroke-linejoin="round"/><path d="M 720 353 L 720 363 L 711 368.77777777777777 L 729 374.55555555555554 L 711 380.3333333333333 L 729 386.1111111111111 L 711 391.8888888888889 L 729 397.6666666666667 L 711 403.44444444444446 L 729 409.22222222222223 L 720 415 L 720 425" fill="none" stroke="#cc7a21" stroke-width="3"/><text x="745" y="389.0" font-family="Arial" font-size="17" fill="#a65c0c" font-weight="bold" text-anchor="start">R2 = 2 kΩ</text><path d="M 720 425 L 720 465" fill="none" stroke="#34577e" stroke-width="3" stroke-linejoin="round"/><path d="M 260 465 L 885 465" fill="none" stroke="#364a62" stroke-width="3" stroke-linejoin="round"/><path d="M 720 465 L 720 478" fill="none" stroke="#34577e" stroke-width="3" stroke-linejoin="round"/><path d="M 703 478 L 737 478" fill="none" stroke="#34577e" stroke-width="3" stroke-linejoin="round"/><path d="M 710 485 L 730 485" fill="none" stroke="#34577e" stroke-width="3" stroke-linejoin="round"/><path d="M 716 492 L 724 492" fill="none" stroke="#34577e" stroke-width="3" stroke-linejoin="round"/><text x="720" y="287" font-family="Arial" font-size="16" fill="#cc7a21" font-weight="bold" text-anchor="middle">V ≈ 3.33 V*</text><rect x="65" y="518" width="1002" height="50" rx="7" fill="#fff5e7" stroke="#e2a75f" stroke-width="2"/><text x="85" y="541" font-family="Arial" font-size="15" fill="#86521c" font-weight="normal" text-anchor="start">* Valor calculado para 5 V nominales, no medido. Con tolerancias, no equivale a una garantía de ≤ 3.3 V.</text><text x="85" y="561" font-family="Arial" font-size="14" fill="#86521c" font-weight="normal" text-anchor="start">  Alimentación y tierras del sensor/ESP32 deben corresponder al montaje real. No conectar ECHO directo al GPIO.</text></svg>