<path d="M330 335 H460 M550 335 H700 M740 335 H1020"/>
<path d="M330 445 H460 M550 445 H700 M740 445 H1020"/>
<rect x="460" y="211" width="90" height="28" fill="white"/>
<rect x="460" y="321" width="90" height="28" fill="white"/>
<rect x="460" y="431" width="90" height="28" fill="white"/>
<path d="M700 202 L738 225 L700 248 Z" fill="#f4bbbb"/><path d="M740 201 V249"/>
<path d="M700 312 L738 335 L700 358 Z" fill="#ffe19c"/><path d="M740 311 V359"/>
<path d="M700 422 L738 445 L700 468 Z" fill="#b5e1be"/><path d="M740 421 V469"/>
<g marker-end="url(#arrow)" stroke-width="2">
<path d="M716 198 L740 174"/><path d="M738 204 L762 180"/>
<path d="M716 308 L740 284"/><path d="M738 314 L762 290"/>
<path d="M716 418 L740 394"/><path d="M738 424 L762 400"/>
</g>
