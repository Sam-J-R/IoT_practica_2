</g>
<g fill="#304963"><circle cx="1020" cy="335" r="5"/><circle cx="1020" cy="445" r="5"/><circle cx="870" cy="490" r="5"/></g>
<g font-size="18">
<text x="310" y="230" text-anchor="end">GPIO 33</text><text x="310" y="340" text-anchor="end">GPIO 25</text><text x="310" y="450" text-anchor="end">GPIO 26</text><text x="310" y="495" text-anchor="end">GND</text>
<text x="505" y="196" text-anchor="middle">R1 · 220 Ω</text><text x="505" y="306" text-anchor="middle">R2 · 220 Ω</text><text x="505" y="416" text-anchor="middle">R3 · 220 Ω</text>
<text x="817" y="213" fill="#ae253b">D1 · ROJO</text><text x="817" y="323" fill="#956211">D2 · AMARILLO</text><text x="817" y="433" fill="#21773a">D3 · VERDE</text>
</g>
<g font-size="14" text-anchor="middle" fill="#526176"><text x="676" y="259">A (+)</text><text x="770" y="259">K (−)</text><text x="676" y="369">A (+)</text><text x="770" y="369">K (−)</text><text x="676" y="479">A (+)</text><text x="770" y="479">K (−)</text></g>
<rect x="48" y="555" width="1104" height="53" rx="8" fill="#edf4fb" stroke="#9bb4cd"/>
<text x="68" y="578" font-size="16">A = ánodo; K = cátodo. Flechas salientes: emisión de luz. Cátodos conectados a GND.</text>
<text x="68" y="599" font-size="16">El firmware apaga las tres salidas antes de activar un color. Las resistencias de los LEDs se conservan.</text>
</g></svg>
