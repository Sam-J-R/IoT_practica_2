<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Objeto actuador: tres LEDs con resistencias de 220 ohmios</title>
<desc id="desc">GPIO 33, 25 y 26 alimentan respectivamente LED rojo, amarillo y verde mediante una resistencia de 220 ohmios por rama. Ánodos a la resistencia y cátodos a tierra común.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#304963"/></marker></defs>
<rect width="1200" height="640" fill="white"/>
<g font-family="Arial, sans-serif" fill="#182b43">
<text x="48" y="48" font-size="27" font-weight="bold">Objeto actuador — circuito de señalización</text>
<text x="48" y="79" font-size="17" fill="#526176">DOIT ESP32 DevKit v1 · tres ramas independientes · salida activa en HIGH</text>
<rect x="60" y="125" width="270" height="390" rx="10" fill="#f1f5fa" stroke="#526b8b" stroke-width="2"/>
<path d="M195 100 V125" stroke="#ba3445" stroke-width="3"/>
<text x="218" y="113" font-size="16" fill="#9d2638">USB · 5 V</text>
<text x="195" y="163" text-anchor="middle" font-size="23" font-weight="bold">ESP32 actuador</text>
<text x="195" y="187" text-anchor="middle" font-size="14" fill="#526176">Lógica y salidas: 3,3 V</text>
<g fill="none" stroke="#304963" stroke-width="3">
